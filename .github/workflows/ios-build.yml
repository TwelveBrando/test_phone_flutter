name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr ../ipa/test_phone_flutter.ipa Payload
          ls -lh ../ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: test_phone_flutter-ipa
          path: build/ios/ipa/test_phone_flutter.ipa
          if-no-files-found: error
          retention-days: 14
