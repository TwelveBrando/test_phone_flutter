<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Launch Check</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0fdf4;
      color: #14532d;
      padding: 24px;
      text-align: center;
    }
    .ok { font-size: 4rem; line-height: 1; }
    h1 { font-size: 1.35rem; margin-top: 12px; }
    p { margin-top: 8px; color: #166534; }
    time { display: block; margin-top: 20px; font-size: 0.9rem; color: #4b5563; }
  </style>
</head>
<body>
  <div class="ok" aria-hidden="true">✓</div>
  <h1>Приложение запущено</h1>
  <p id="platform"></p>
  <time id="time"></time>
  <script>
    document.getElementById("platform").textContent =
      navigator.platform + " · " + (navigator.userAgent.includes("iPhone") ? "iPhone" : "iOS/Safari");
    document.getElementById("time").textContent =
      "Старт: " + new Date().toLocaleString("ru-RU");
    console.log("[LaunchCheck] OK", navigator.userAgent);
  </script>
</body>
</html>
